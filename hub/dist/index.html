<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TFS App</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg, #1e1e1e);
        color: var(--splash-text, #e0e0e0);
        font-family: sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid color-mix(in srgb, var(--splash-text, #e0e0e0) 22%, transparent);
        border-top-color: var(--splash-text, #e0e0e0);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- The window a launched app is served in navigates away from this page
         to its own http://127.0.0.1:<port> as soon as /healthz answers (plan
         007); until then this is what the user looks at. Checked in, with no
         Node toolchain and no package.json anywhere in the build path — the
         hub *is* the app, so there is no external frontend project to mount. -->
    <main>
      <div class="spinner"></div>
      <span id="splash-status">Starting…</span>
    </main>
  </body>
</html>
