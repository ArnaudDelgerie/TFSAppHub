[[permission]]
identifier = "allow-secrets"
description = "Allows an app's frontend to reach actions.secrets over Tauri's own IPC (secret_has/secret_get/secret_set/secret_delete/secret_list) — the same store its Symfony side can reach over the HTTP bridge when it declares bridge: true. One permission for all five commands, matching the all-or-nothing actions.secrets.ipc granularity (see CONTRACT.md §2). Granted at runtime, per launch, only when the installed app's own manifest declares it; the static capability grants nothing."
commands.allow = ["secret_has", "secret_get", "secret_set", "secret_delete", "secret_list"]
