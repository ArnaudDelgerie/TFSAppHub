[[permission]]
identifier = "allow-open-files"
description = "Allows an app's frontend to reach actions.open_files over Tauri's own IPC (open_files_pending/open_files_ack) — the receiver half of the local-file handoff, scoped to the calling window's own pending requests. The group is IPC-only like the picker: no HTTP bridge route, environment value or PHP permission exists for it. The same runtime capability also grants core:event:allow-listen and core:event:allow-unlisten, because the receiver cannot be notified of a queued request without registering a listener for the hub's tfsapp://open-files-pending event — the two travel together, and neither is ever granted statically. Granted at runtime, per launch, only when the installed app's own manifest declares actions.open_files.ipc; the static capability grants nothing, and a splash page never receives it — the capability is remote-only, like the other groups'."
commands.allow = ["open_files_pending", "open_files_ack"]
