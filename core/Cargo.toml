[package]
name = "tfsapp-core"
version = "0.1.0"
description = "Identity-agnostic half of the hub: process supervision, ports, health, logs, sidecar spawning."
authors = ["TFSAppHub"]
edition = "2021"

# This crate must NEVER depend on `tauri`, directly or through a feature.
# That absence is the whole point of the core/hub split (plan 001): everything
# here is testable headless and reusable by a non-Tauri host, and a `tauri`
# line added below would turn a real boundary back into a mere directory.
[dependencies]
# `setpgid` in the spawn-time process-group helper, `getpgid` behind the
# group/pid signalling decision, and the non-blocking `flock` plus the
# self-pipe (`pipe`/`read`/`write`/`signal`) the sidecar liveness lock and the
# signal forwarding are built on — all in `process.rs`.
libc.workspace = true

[dev-dependencies]
# Throwaway pid-file/lock-file/log directories for the ported unit tests, so
# none of them writes anywhere but a temp dir it owns.
tempfile = "3"
